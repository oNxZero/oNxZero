name: Refresh profile

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - assets/logos/**
      - assets/project-logos/**
      - assets/fonts/**
      - assets/icons/**
      - data/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'oNxZero/oNxZero'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check generator
        run: python3 -m unittest discover -s tests -v
      - name: Render profile from public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python3 scripts/render_profile.py
      - name: Commit refreshed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets data README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile stats [skip ci]'
            git push
          fi
